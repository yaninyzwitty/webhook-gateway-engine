version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries/"
    schema: "db/migrations/"
    gen:
      go:
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "int4"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Int4"
            nullable: true
          - db_type: "text"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Text"
            nullable: true